<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Ahmed Amine Drira, full stack developer: from business need to production</title>
  <style>
    .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
    @media (prefers-reduced-motion: reduce) { .runner { display: none; } }
  </style>

  <rect width="1200" height="280" rx="16" fill="#eef1f8"/>

  <text x="56" y="100" class="sans" font-size="46" font-weight="700" letter-spacing="-1" fill="#1a1f36">Ahmed Amine Drira</text>
  <text x="56" y="140" class="sans" font-size="20" fill="#4a5376">Full stack developer and software engineering student at ESPRIT, Tunis</text>

  <!-- pipeline: business need → specs → code → production -->
  <line x1="70" y1="205" x2="1130" y2="205" stroke="#c3cae3" stroke-width="2" stroke-dasharray="6 7"/>

  <circle cx="70"   cy="205" r="9" fill="#eef1f8" stroke="#6b7394" stroke-width="2"/>
  <circle cx="423"  cy="205" r="9" fill="#eef1f8" stroke="#6b7394" stroke-width="2"/>
  <circle cx="776"  cy="205" r="9" fill="#eef1f8" stroke="#6b7394" stroke-width="2"/>
  <circle cx="1130" cy="205" r="17" fill="none" stroke="#3b5bdb" stroke-opacity="0.3" stroke-width="2"/>
  <circle cx="1130" cy="205" r="10" fill="#3b5bdb"/>

  <circle class="runner" cx="70" cy="205" r="4" fill="#3b5bdb">
    <animate attributeName="cx" values="70;1130;1130" keyTimes="0;0.8;1" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.78;0.82" dur="6s" repeatCount="indefinite"/>
  </circle>

  <text x="56"   y="248" class="mono" font-size="15" fill="#4a5376">business need</text>
  <text x="423"  y="248" class="mono" font-size="15" fill="#4a5376" text-anchor="middle">specs</text>
  <text x="776"  y="248" class="mono" font-size="15" fill="#4a5376" text-anchor="middle">code</text>
  <text x="1144" y="248" class="mono" font-size="15" fill="#1a1f36" text-anchor="end">production</text>
</svg>
